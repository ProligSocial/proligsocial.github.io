<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Prolig | Parola Sıfırla</title>
  <meta name="theme-color" content="#E41E26" />
  <style>
    body{margin:0;background:#f9f9f9;font:16px/1.6 system-ui,-apple-system,Arial}
    .card{max-width:520px;margin:8vh auto;background:#fff;padding:28px;border-radius:14px;box-shadow:0 6px 18px rgba(0,0,0,.08);text-align:center}
    img{width:88px;height:88px;border-radius:50%;object-fit:cover;margin-bottom:12px}
    h1{margin:8px 0 6px;color:#E41E26}
    p{color:#333}
    form{margin-top:18px;display:grid;gap:10px}
    input{padding:12px 14px;border:1px solid #ddd;border-radius:10px;font-size:15px}
    button{padding:12px 18px;border:0;border-radius:10px;background:#E41E26;color:#fff;font-weight:700;cursor:pointer}
    .msg{margin-top:12px;font-size:14px}
    .ok{color:#138000}.err{color:#b00020}
  </style>
  <script src="https://unpkg.com/@supabase/supabase-js@2"></script>
</head>
<body>
  <div class="card">
    <img src="./logo.png" alt="Prolig" />
    <h1>Yeni Parola Belirle</h1>
    <p>E-postadaki bağlantıdan geldiyseniz yeni parolanızı aşağıdan belirleyin.</p>

    <form id="form">
      <input id="password" type="password" placeholder="Yeni parola" required />
      <input id="password2" type="password" placeholder="Yeni parola (tekrar)" required />
      <button type="submit">Parolayı Güncelle</button>
    </form>

    <div id="msg" class="msg"></div>
  </div>

  <script>
    const SUPABASE_URL = 'https://YOUR_PROJECT_ID.supabase.co';
    const SUPABASE_ANON_KEY = 'YOUR_ANON_KEY';
    const client = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    // URL fragmanı: #access_token=...&refresh_token=...&type=recovery&expires_in=...
    function parseHashParams() {
      const hash = window.location.hash.startsWith('#') ? window.location.hash.substring(1) : '';
      const params = new URLSearchParams(hash);
      return {
        access_token: params.get('access_token'),
        refresh_token: params.get('refresh_token'),
        type: params.get('type'),
        expires_in: params.get('expires_in')
      };
    }

    async function ensureRecoverySession() {
      const { access_token, refresh_token, type } = parseHashParams();
      if (!access_token || !refresh_token || type !== 'recovery') {
        throw new Error('Geçersiz ya da eksik kurtarma bağlantısı.');
      }
      // Tarayıcı oturumunu kur
      const { data, error } = await client.auth.setSession({
        access_token,
        refresh_token
      });
      if (error) throw error;
      return data.session;
    }

    (async () => {
      const msg = document.getElementById('msg');
      try {
        await ensureRecoverySession();
        msg.textContent = 'Lütfen yeni parolanızı girin.';
      } catch (e) {
        msg.className = 'msg err';
        msg.textContent = 'Bağlantı doğrulanamadı: ' + e.message;
        document.getElementById('form').style.display = 'none';
      }
    })();

    document.getElementById('form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const p1 = document.getElementById('password').value.trim();
      const p2 = document.getElementById('password2').value.trim();
      const msg = document.getElementById('msg');

      if (p1.length < 8) {
        msg.className = 'msg err';
        msg.textContent = 'Parola en az 8 karakter olmalı.';
        return;
      }
      if (p1 !== p2) {
        msg.className = 'msg err';
        msg.textContent = 'Parolalar eşleşmiyor.';
        return;
      }

      const { data, error } = await client.auth.updateUser({ password: p1 });
      if (error) {
        msg.className = 'msg err';
        msg.textContent = 'Güncelleme başarısız: ' + error.message;
      } else {
        msg.className = 'msg ok';
        msg.textContent = 'Parola güncellendi. Uygulamayı açabilirsiniz.';
        // İstersen otomatik deep link:
        setTimeout(() => { window.location.href = 'prolig://auth-callback'; }, 1200);
      }
    });
  </script>
</body>
</html>
