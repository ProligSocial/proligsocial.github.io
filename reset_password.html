<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Prolig | Parola Sıfırla</title>
  <meta name="theme-color" content="#E41E26" />
  <style>
    :root { --brand: #E41E26; }
    * { box-sizing: border-box; }
    body{margin:0;background:#f9f9f9;font:16px/1.6 system-ui,-apple-system,Segoe UI,Roboto,Arial}
    .wrap{max-width:520px;margin:8vh auto;background:#fff;padding:28px;border-radius:14px;box-shadow:0 6px 18px rgba(0,0,0,.08)}
    .center{text-align:center}
    img.logo{width:90px;height:90px;object-fit:contain;margin:6px auto 12px;display:block}
    h1{margin:8px 0 6px;color:var(--brand);font-size:22px;text-align:center}
    p{color:#333;margin:8px 0}
    .muted{color:#777;font-size:14px}
    .ok{color:#138000}.err{color:#b00020}
    form{margin-top:16px;display:grid;gap:12px}
    input{padding:12px 14px;border:1px solid #ddd;border-radius:10px;font-size:15px;width:100%}
    button{padding:12px 18px;border:0;border-radius:10px;background:var(--brand);color:#fff;font-weight:700;cursor:pointer}
    button[disabled]{opacity:.6;cursor:not-allowed}
    .msg{margin-top:10px;font-size:14px;min-height:20px}
    footer{margin-top:14px;text-align:center;color:#999;font-size:12px}
    .hidden{display:none}
  </style>
  <script src="https://unpkg.com/@supabase/supabase-js@2"></script>
</head>
<body>
  <div class="wrap">
    <img class="logo" alt="Prolig" src="https://mmyuxswdkqotljcispyc.supabase.co/storage/v1/object/public/logos/logo.png" />
    <h1>Yeni Parola Belirle</h1>
    <p class="muted center" id="state">Bağlantınız doğrulanıyor…</p>

    <!-- Başarı mesajı -->
    <div id="okBox" class="hidden center">
      <p class="ok"><strong>Oturum doğrulandı.</strong> Lütfen yeni parolanızı girin.</p>
    </div>

    <!-- Hata mesajı -->
    <div id="errBox" class="hidden center">
      <p class="err"><strong>Hata:</strong> Bağlantı doğrulanamadı.</p>
      <p id="errDetail" class="muted"></p>
    </div>

    <!-- Parola formu -->
    <form id="form" class="hidden" autocomplete="off">
      <input id="p1" type="password" placeholder="Yeni parola (min 8 karakter)" minlength="8" required />
      <input id="p2" type="password" placeholder="Yeni parola (tekrar)" minlength="8" required />
      <button id="submitBtn" type="submit">Parolayı Güncelle</button>
      <div id="formMsg" class="msg"></div>
    </form>

    <!-- Başarılı güncelleme -->
    <div id="doneBox" class="hidden center">
      <p class="ok"><strong>Parola başarıyla güncellendi.</strong></p>
      <p class="muted">Bu sayfayı kapatabilir ve Prolig uygulamasına dönebilirsiniz.</p>
    </div>

    <footer>© 2025 Prolig</footer>
  </div>

  <script>
    // 🔧 DOLDUR (kendi projen):
    const SUPABASE_URL = 'https://YOUR_PROJECT_ID.supabase.co';
    const SUPABASE_ANON_KEY = 'YOUR_ANON_KEY';

    const client = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
    const $ = (id) => document.getElementById(id);
    const show = (id) => $(id).classList.remove('hidden');
    const hide = (id) => $(id).classList.add('hidden');

    async function establishSessionFromCode() {
      // Bu sayfa ?code=... ile çağrılıyor (PKCE). Hash yerine querystring var.
      // Supabase v2: exchangeCodeForSession ile direkt oturuma çeviriyoruz.
      const { data, error } = await client.auth.exchangeCodeForSession(window.location.href);
      if (error) throw error;
      return data.session;
    }

    (async () => {
      try {
        $('state').textContent = 'Oturum kuruluyor…';
        await establishSessionFromCode();
        $('state').textContent = 'Oturum doğrulandı.';
        show('okBox');
        show('form');
      } catch (e) {
        show('errBox');
        $('errDetail').textContent = (e && e.message) ? e.message : String(e);
        $('state').textContent = 'İşlem başarısız.';
      }
    })();

    $('form').addEventListener('submit', async (ev) => {
      ev.preventDefault();
      const btn = $('submitBtn');
      const msg = $('formMsg');
      const p1 = $('p1').value.trim();
      const p2 = $('p2').value.trim();

      msg.className = 'msg';

      if (p1.length < 8) {
        msg.classList.add('err');
        msg.textContent = 'Parola en az 8 karakter olmalı.';
        return;
      }
      if (p1 !== p2) {
        msg.classList.add('err');
        msg.textContent = 'Parolalar eşleşmiyor.';
        return;
      }

      btn.disabled = true;
      msg.textContent = 'Güncelleniyor…';

      const { data, error } = await client.auth.updateUser({ password: p1 });

      if (error) {
        msg.classList.add('err');
        msg.textContent = 'Güncelleme başarısız: ' + error.message;
        btn.disabled = false;
        return;
      }

      // Başarılı
      hide('form');
      hide('okBox');
      show('doneBox');
      $('state').textContent = 'Tamamlandı.';
    });
  </script>
</body>
</html>
